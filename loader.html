<!-- ============================================================
TeraWulf custom-code loading — two pieces:

1) CSS base link — lives in the global embed component (g-embed-code),
   next to the phosphor-icons links:

   <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/brandvm/terawulf@1.1.0/dist/styles.css" />

2) JS loader — Site settings → Custom code → Footer code (below).
   prod = pinned jsDelivr tag
   webflow.io = latest pushed staging bundle (JS + CSS override)
   dev flag (localStorage bv-dev=1, staging only) = localhost:3000

At release: bump the @X.Y.Z in BOTH the embed link and the footer
loader, then publish. Rollback = revert both strings.
============================================================ -->
<script>
(function () {
  var VER      = '1.1.0';
  var PROD_JS  = 'https://cdn.jsdelivr.net/gh/brandvm/terawulf@' + VER + '/dist/index.js';
  var STAG     = 'https://brandvm.github.io/terawulf/';
  var DEV      = 'http://localhost:3000/';
  var staging = /\.webflow\.io$/.test(location.hostname);
  var flag = false;
  try { flag = staging && localStorage.getItem('bv-dev') === '1'; } catch (e) {}
  function js(src, fallback) {
    var s = document.createElement('script');
    s.src = src;
    if (fallback) s.onerror = fallback;
    document.head.appendChild(s);
  }
  function css(href) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href;
    document.head.appendChild(l); // loads after the base link → overrides it
  }
  var v = '?v=' + Date.now();
  if (flag) {
    js(DEV + 'index.js', function () { js(STAG + 'index.js' + v); });
    css(DEV + 'styles.css');
  } else if (staging) {
    js(STAG + 'index.js' + v, function () { js(PROD_JS); });
    css(STAG + 'styles.css' + v);
  } else {
    js(PROD_JS);
  }
})();
</script>
