<!-- Site JS+CSS loader: prod = pinned jsDelivr tag | webflow.io = latest pushed staging bundle | dev = ?bv-dev=1 (&bv-host=IP:3000 for LAN) -->
<script>
(function () {
  var VER      = '1.1.1';
  var PROD_JS  = 'https://cdn.jsdelivr.net/gh/brandvm/terawulf@' + VER + '/dist/index.js';
  var STAG     = 'https://brandvm.github.io/terawulf/';
  var staging = /\.webflow\.io$/.test(location.hostname);
  var flag = false, devHost = 'localhost:3000';
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('bv-dev')) localStorage.setItem('bv-dev', q.get('bv-dev'));
    if (q.get('bv-host')) localStorage.setItem('bv-host', q.get('bv-host'));
    flag = staging && localStorage.getItem('bv-dev') === '1';
    devHost = localStorage.getItem('bv-host') || devHost;
  } catch (e) {}
  var DEV = 'http://' + devHost + '/';
  function js(src, fallback) {
    var s = document.createElement('script');
    s.src = src;
    if (fallback) s.onerror = fallback;
    document.head.appendChild(s);
  }
  function css(href) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href;
    document.head.appendChild(l);
  }
  var v = '?v=' + Date.now();
  if (flag) {
    js(DEV + 'index.js', function () { js(STAG + 'index.js' + v); });
    css(DEV + 'styles.css');
  } else if (staging) {
    js(STAG + 'index.js' + v, function () { js(PROD_JS); });
    css(STAG + 'styles.css' + v);
  } else {
    js(PROD_JS);
  }
})();
</script>
