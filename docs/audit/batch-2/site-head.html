<!-- brandvm/terawulf loader, piece 1 of loader.html (RELEASE is the live version) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

<script>
  (function () {
    var RELEASE = "1.2.0"; // the release tag, e.g. "1.0.0" — also update the @version in Embed 2a
    var OWNER = "brandvm"; // the GitHub org or user that owns this repo
    var SITE = "terawulf"; // this repo's name
    var STAG = "https://" + OWNER + ".github.io/" + SITE + "/";
    var DEV = "http://localhost:3000/";
    var staging = /\.webflow\.io$/.test(location.hostname);
    var q = new URLSearchParams(location.search);
    var flag = staging && q.get("wfc-dev") === "1";
    try {
      if (staging && q.has("wfc-dev")) localStorage.setItem("wfc-dev", flag ? "1" : "0");
      if (staging && !q.has("wfc-dev")) flag = localStorage.getItem("wfc-dev") === "1";
    } catch (e) { /* An explicit URL flag still works without storage. */ }
    var prod = RELEASE
      ? "https://cdn.jsdelivr.net/gh/" + OWNER + "/" + SITE + "@" + RELEASE + "/dist/"
      : STAG;
    if (!staging && !RELEASE)
      console.error("[wfc] RELEASE is not set in head code; serving the staging bundle. Tag a release and set RELEASE before launch.");
    // Shared config — the Embed, the footer loader and the bundle read this.
    window.WFC = {
      staging: staging, dev: flag, devBase: DEV, stag: STAG,
      release: RELEASE, prod: prod,
      // One cache-buster for the Embed and the footer loader, so staging
      // fetches styles.css once instead of once per snippet.
      v: "?v=" + Date.now(),
    };

    // TeraWulf: no pre-paint scroll lock (template's html.is-loading). The
    // bundle loads after Webflow's interaction scripts, so a lock would
    // freeze scrolling for a second or more on phones, and nothing on this
    // site needs it. src/index.ts still removes the class if present.
  })();
</script>
